name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Build Solution
        run: dotnet build WinForge.sln --configuration Release --nologo

      - name: Run Tests
        run: dotnet test WinForge.sln --configuration Release --no-build --nologo
